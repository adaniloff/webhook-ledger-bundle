name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.2"
            symfony-version: "7.4.*"
            doctrine-bundle-version: "^2.13"
          - php-version: "8.4"
            symfony-version: "8.1.*"
            doctrine-bundle-version: "^3.0"

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: webhook_ledger_bundle_test
          MARIADB_USER: app
          MARIADB_PASSWORD: app
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://app:app@127.0.0.1:3306/webhook_ledger_bundle_test?serverVersion=10.11.0-MariaDB&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, intl, zip, pdo_mysql, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.symfony-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.symfony-version }}-

      - name: Install dependencies (Symfony ${{ matrix.symfony-version }})
        run: |
          composer update \
            "symfony/config:${{ matrix.symfony-version }}" \
            "symfony/console:${{ matrix.symfony-version }}" \
            "symfony/dependency-injection:${{ matrix.symfony-version }}" \
            "symfony/event-dispatcher:${{ matrix.symfony-version }}" \
            "symfony/framework-bundle:${{ matrix.symfony-version }}" \
            "symfony/http-foundation:${{ matrix.symfony-version }}" \
            "symfony/http-kernel:${{ matrix.symfony-version }}" \
            "symfony/messenger:${{ matrix.symfony-version }}" \
            "symfony/routing:${{ matrix.symfony-version }}" \
            "symfony/uid:${{ matrix.symfony-version }}" \
            "symfony/doctrine-messenger:${{ matrix.symfony-version }}" \
            "symfony/var-exporter:${{ matrix.symfony-version }}" \
            "doctrine/doctrine-bundle:${{ matrix.doctrine-bundle-version }}" \
            --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Coding standards (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse src --level=max --ansi

      - name: Architecture boundaries (deptrac)
        run: vendor/bin/deptrac analyse --no-cache --ansi

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
